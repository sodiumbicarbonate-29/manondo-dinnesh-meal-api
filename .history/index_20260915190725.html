<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Meal Menu</title>
    <style>
        body { 
            font-family: Arial, 
            sans-serif; 
            padding: 20px; }
        table { 
            border-collapse: collapse; 
            width: 50%; 
        }
        th, td { 
            border: 1px solid #ccc; 
            padding: 10px; 
            text-align: left; 
        }
        th { 
            background-color: #f2f2f2; 
        }
        input { 
            margin-bottom: 10px; 
            padding: 8px; 
            width: 50%; 
        }
    </style>
</head>
<body>
    <h2>Meal Menu</h2>
    <input type="text" id="search" placeholder="Search meal">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="meal-table"></tbody>
    </table>

    <script>
        let allMeals = []

        fetch('/api/meals')
            .then(res => res.json())
            .then(meals => {
                allMeals = meals
                renderTable(meals)
            })

        function renderTable(meals) {
            const tbody = document.getElementById('meal-table')
            tbody.innerHTML = ''
            meals.forEach(meal => {
                tbody.innerHTML += `<tr><td>${meal.id}</td><td>${meal.name}</td><td>${meal.price}</td></tr>`
            })
        }

        document.getElementById('search').addEventListener('input', function() {
            const query = this.value.toLowerCase()
            const filtered = allMeals.filter(meal => meal.name.toLowerCase().includes(query))
            renderTable(filtered)
        })
    </script>
</body>
</html>
